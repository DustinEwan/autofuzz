name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The engine and the protocol crate. Published harnesses are not installed here: conformance
  # is a property of a harness, and each harness repository's own CI drives the suite against
  # it. This job exercises the engine's side of the install contract against the repository's
  # own fake plugin, and runs every test that needs no plugin beyond it.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The install machinery end to end on a real git source: clone, manifest parse, spawn,
      # protocol-version and name match, and the registry record. The fixture is the fake
      # plugin this repository already ships, generated as a one-file harness repository.
      - name: Install the fake plugin through the install machinery
        run: |
          cargo build --release -p afz-cli -p afz-xtask
          repo=$(mktemp -d)
          printf '{"name":"afz-fakeplugin","command":["%s/target/release/afz-fakeplugin"]}\n' "$PWD" > "$repo/afz-harness.json"
          git -C "$repo" init -q
          git -C "$repo" -c user.email=ci@autofuzz.local -c user.name=ci add -A
          git -C "$repo" -c user.email=ci@autofuzz.local -c user.name=ci commit -qm "fake harness"
          ./target/release/afz install-harness "$repo"
          ./target/release/afz harnesses | grep -q '^afz-fakeplugin '

      # The gate: any clippy warning in any target, including tests, fails the job.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # `curl | sh` runs this file with sh, which is dash on Debian and Ubuntu, so a bashism breaks the
  # installer silently. shellcheck plus a real dash parse is the gate.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the installer
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck dash
          shellcheck -s sh install.sh
          dash -n install.sh
