name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The engine and the protocol crate. `cargo test --workspace` includes the Rust tests that
  # spawn the js-ts and python plugins over stdio, and the three template gates read their
  # plugin, emitter, and project root from the install records, so this job installs every
  # shipped harness before running anything.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Each install builds the harness and drives the full conformance suite, so this step is
      # itself the wire-rules gate: a shipped harness that stops conforming fails the build here.
      - name: Install the harness plugins
        run: |
          cargo build --release -p afz-cli
          ./target/release/afz install-harness https://github.com/DustinEwan/autofuzz-harness-js-ts.git
          ./target/release/afz install-harness https://github.com/DustinEwan/autofuzz-harness-python.git
          ./target/release/afz install-harness https://github.com/DustinEwan/autofuzz-harness-wasm.git
          ./target/release/afz install-harness https://github.com/DustinEwan/autofuzz-harness-starter.git
          ./target/release/afz install-harness https://github.com/DustinEwan/autofuzz-harness-openapi.git

      # The gate: any clippy warning in any target, including tests, fails the job.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # `curl | sh` runs this file with sh, which is dash on Debian and Ubuntu, so a bashism breaks the
  # installer silently. shellcheck plus a real dash parse is the gate.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the installer
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck dash
          shellcheck -s sh install.sh
          dash -n install.sh
