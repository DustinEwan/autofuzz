[workspace]
resolver = "2"
members = [
    "crates/afz-protocol",
    "crates/afz-engine",
    "crates/afz-conformance",
    "crates/afz-cli",
    "crates/afz-mcp",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
afz-protocol = { path = "crates/afz-protocol" }
afz-engine = { path = "crates/afz-engine" }
afz-conformance = { path = "crates/afz-conformance" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
# Arrow-key menus and inline defaults for `afz init`; the editor and password prompts are not
# used, so their tempfile/zeroize tree stays out.
dialoguer = { version = "0.12.0", default-features = false }
rand = "0.10.3"
rand_chacha = "0.10.0"
sha2 = "0.11.1"
num_cpus = "1.17.0"
rmcp = { version = "3.9.0", features = ["transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.release]
overflow-checks = true
