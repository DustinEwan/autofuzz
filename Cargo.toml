[workspace]
resolver = "2"
members = [
    "crates/afz-protocol",
    "crates/afz-engine",
    "crates/afz-conformance",
    "crates/afz-cli",
    "crates/afz-mcp",
    "crates/afz-wasm",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
afz-protocol = { path = "crates/afz-protocol" }
afz-engine = { path = "crates/afz-engine" }
afz-conformance = { path = "crates/afz-conformance" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
sha2 = "0.11.1"
num_cpus = "1.17.0"
wasmtime = "50.0.1"
wasmparser = "0.263.0"
wasm-encoder = "0.263.0"
rmcp = { version = "3.9.0", features = ["transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.release]
overflow-checks = true
