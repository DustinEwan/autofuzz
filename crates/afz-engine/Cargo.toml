[package]
name = "afz-engine"
description = "autofuzz engine: generation, corpus, scheduling, supervision, oracles, reporting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
afz-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
rand.workspace = true
rand_chacha.workspace = true
sha2.workspace = true
num_cpus.workspace = true

[dev-dependencies]
# `scan.json` is validated against the committed schema in tests, and the
# validator is not something the engine needs at run time.
afz-xtask = { path = "../xtask" }
jsonschema = { version = "0.61.1", default-features = false }
