[package]
name = "afz-conformance"
description = "the harness-plugin conformance suite behind `afz validate-harness` and `afz-xtask check-harness`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The suite drives the same `Launch`/`PluginClient` transport the engine uses in a scan, so a
# validated plugin is driven exactly as production drives it.
afz-engine.workspace = true
afz-protocol.workspace = true
# Every plugin response is validated as an instance of the committed schema before deserialization.
jsonschema = { version = "0.61.1", default-features = false }
# The suite program reads the profile spec and the plugin manifest the mechanism wrote, and
# writes the verdicts it reads back (pluginrpc `spec/spec.md` §12 item 6).
plugin-rpc.workspace = true
serde.workspace = true
serde_json.workspace = true
# The report types carry a JSON Schema so the `afz_validate_harness` MCP tool can describe the
# report it returns.
schemars.workspace = true
