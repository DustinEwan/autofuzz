[package]
name = "afz-xtask"
description = "repository helpers: fake harness plugin, schema generation."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "afz-xtask"

[lib]
name = "afz_xtask"
path = "src/lib.rs"

[[bin]]
name = "afz-xtask"
path = "src/main.rs"

[[bin]]
name = "afz-fakeplugin"
path = "src/fakeplugin.rs"

[dependencies]
# The scan-result schema is generated from the engine's document type, so the schema tool reads
# the same type the writer uses. `afz-engine` dev-depends on this crate, which Cargo allows.
afz-engine = { path = "../afz-engine" }
afz-protocol.workspace = true
# `check-harness` is a thin CLI over the product-side conformance library.
afz-conformance.workspace = true
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true
