[package]
name = "afz-wasm"
description = "autofuzz wasm harness plugin: a wasmtime runner that speaks the plugin protocol over stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "afz-wasm"
path = "src/main.rs"

[dependencies]
afz-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
wasmtime.workspace = true
wasmparser.workspace = true
wasm-encoder = { version = "0.263.0", features = ["wasmparser"] }
rustc-demangle = "0.1.28"
