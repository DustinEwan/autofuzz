[package]
name = "afz-cli"
description = "the afz command"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "afz"
path = "src/main.rs"

[dependencies]
afz-protocol.workspace = true
afz-engine.workspace = true
afz-conformance.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
# Ctrl-C sets the stop flag between batches so the engine still writes its scan result.
ctrlc = "3.5.2"
thiserror.workspace = true

[dev-dependencies]
afz-xtask = { path = "../xtask" }
